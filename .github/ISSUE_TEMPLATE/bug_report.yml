name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser and version, Node.js version
  - type: markdown
    attributes:
      value: Please do not include patient or sensitive student information.
